<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Eco Town: Land</title>
<!-- A playable trial of level 1, Land, built on the shared level kit. Every word on the page is a placeholder. -->
<link rel="stylesheet" href="../../../ui/tokens.css">
<link rel="stylesheet" href="../../level-kit/kit.css">
<style>
  /* small pictures that stand in front of a result sentence, and the two part buttons of the play break */
  .evpic { width: 40px; height: 30px; vertical-align: -9px; margin-right: 2px; }
  .tok.mini.land { width: 104px; }
  .plate.line { background: #fff; font-size: 16px; }
  /* the three buttons of the look step, over the top of the picture and under the title of the step */
  .lookbar { position: absolute; left: 0; right: 0; top: 78px; display: flex; justify-content: center; gap: 10px; z-index: 4; }
  .lookchip { display: flex; align-items: center; gap: 8px; min-height: 48px; padding: 4px 14px 4px 8px; font-size: 18px; background: var(--ui-sun); }
  .lookchip.seen { background: #fff; } .lookchip.on { outline: 4px solid var(--ui-sun); outline-offset: 2px; }
  .lookchip .tagpic { width: 36px; height: 30px; }
  /* what the people at a door say. A worried sentence has a dashed edge and a small mark in front of it, so that it is not told from a glad one by colour */
  .plate.talk { background: #fff; font: 700 16px/1.15 var(--ui-body); border-radius: 14px 14px 14px 2px; z-index: 3; }
  .plate.talk.worry { border-style: dashed; background: var(--ui-paper-dim, #efe6d2); } .plate.talk.worry::before { content: "!"; display: inline-block; width: 18px; height: 18px; margin-right: 6px; border-radius: 50%; background: var(--ui-ink); color: #fff; font: 800 14px/18px var(--ui-display); text-align: center; }
  @media (max-width: 1100px) { .lookbar { top: 62px; gap: 6px; } .lookchip { font-size: 15px; min-height: 40px; } .plate.talk { font-size: 14px; } }
</style>
</head>
<body>
<script type="module" src="level.js"></script>
</body>
</html>
