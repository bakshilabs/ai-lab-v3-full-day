<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Eco Town trial level: a warm home for winter</title>
<link rel="stylesheet" href="../../ui/tokens.css">
<style>
  @font-face { font-family: 'Inter'; src: url('../../animation/inter.woff2') format('woff2'); font-weight: 400 900; }
  @font-face { font-family: 'Bricolage'; src: url('../../animation/bricolage.woff2') format('woff2'); font-weight: 400 900; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; background: #fffaf0; }
  body { font-family: var(--ui-body); color: var(--ui-ink); overflow: hidden; }
  button { font: inherit; color: inherit; }
  .app { position: relative; inset: auto; pointer-events: auto; container: none; display: flex; flex-direction: column; height: 100vh; height: 100dvh; }   /* .ui carries the design tokens */
  .view { position: relative; flex: 1; min-height: 0; overflow: hidden; background: #cfe6f2; }
  .view canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .view.can { cursor: pointer; }
  .top { position: absolute; left: 16px; top: 16px; right: 16px; display: flex; gap: 12px; align-items: flex-start; pointer-events: none; z-index: 3; }
  .chip { display: flex; align-items: center; gap: 10px; height: 48px; padding: 0 18px 0 6px; background: var(--ui-paper); border: 3px solid var(--ui-ink); border-radius: 999px; box-shadow: var(--ui-shadow-rest); font: 700 19px/1 var(--ui-display); white-space: nowrap; }
  .chip b { display: grid; place-items: center; width: 34px; height: 34px; border-radius: 50%; background: var(--ui-town); color: #fff; }
  .chip strong { font-weight: 800; }
  .step { margin: 0 auto; padding: 10px 22px 11px; background: var(--ui-sun); border: 3px solid var(--ui-ink); border-radius: 999px; font: 800 24px/1.1 var(--ui-display); box-shadow: var(--ui-shadow-rest); white-space: nowrap; }
  .step:empty { visibility: hidden; }
  .trial { padding: 6px 12px; background: var(--ui-paper); border: 2px dashed var(--ui-ink-soft); border-radius: 10px; font: 600 14px/1.25 var(--ui-body); color: var(--ui-ink-soft); max-width: 210px; }
  .plates { position: absolute; inset: 0; pointer-events: none; z-index: 2; }
  .plate { position: absolute; transform: translate(-50%, -100%); padding: 5px 12px 6px; background: var(--ui-paper); border: 3px solid var(--ui-ink); border-radius: 10px; font: 800 18px/1 var(--ui-display); white-space: nowrap; box-shadow: 0 4px 0 var(--ui-shade); }
  .plate.on { background: var(--ui-sun); }
  .plate.tap { pointer-events: auto; cursor: pointer; font-style: normal; box-shadow: 0 5px 0 var(--ui-ink); animation: nod 1.4s ease-in-out infinite; } @keyframes nod { 50% { margin-top: -6px; } }
  .plate { font-style: normal; }
  .over { position: absolute; left: 16px; right: 16px; bottom: 14px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; z-index: 3; pointer-events: none; }
  .over:empty { display: none; }
  .card { pointer-events: auto; display: flex; flex-direction: column; gap: 6px; padding: 12px 14px; background: var(--ui-paper); border: 3px solid var(--ui-ink); border-radius: 16px; box-shadow: var(--ui-shadow-rest); animation: pop .3s var(--ui-ease-pop) both; }
  .card:nth-child(2) { animation-delay: .12s; } .card:nth-child(3) { animation-delay: .24s; }
  .card h3 { margin: 0; font: var(--ui-t-name); }
  .card p { margin: 0; font: 600 17px/1.3 var(--ui-body); }
  .card .res { display: grid; grid-template-columns: 30px 1fr; gap: 8px; align-items: start; font: 600 16px/1.3 var(--ui-body); }
  .card .res + .res { border-top: 2px solid var(--ui-paper-dim); padding-top: 6px; }
  .mark { display: grid; place-items: center; width: 28px; height: 28px; border-radius: 50%; color: #fff; font: 800 18px/1 var(--ui-display); }
  .mark.g { background: var(--ui-good); } .mark.f { background: var(--ui-fair); } .mark.p { background: var(--ui-poor); }
  .card.mine { background: #fff3c9; }
  @keyframes pop { from { opacity: 0; transform: translateY(14px) scale(.96); } to { opacity: 1; transform: none; } }
  .band { position: relative; flex: none; display: grid; grid-template-columns: 120px minmax(0, 1fr); gap: 4px 14px; align-items: center; min-height: 190px; padding: 12px 16px 14px 8px; background: var(--ui-paper); border-top: 6px solid var(--ui-ink); }
  .flo { align-self: end; width: 120px; height: 156px; background: url('../../animation/florence-sprite.webp') no-repeat; background-size: 600% 500%; background-position: calc(var(--col, 0) * 20%) calc(var(--row, 0) * 25%); }
  .right { display: flex; flex-wrap: wrap; gap: 12px 16px; align-items: center; }
  .say { flex: 1 1 340px; max-width: 760px; padding: 12px 20px 13px; background: #fff; border: 3px solid var(--ui-ink); border-radius: 22px 22px 22px 6px; box-shadow: var(--ui-shadow-rest); font: 600 21px/1.32 var(--ui-body); }
  .say p { margin: 0; } .say p + p { margin-top: 6px; }
  .tray { flex: 1 1 320px; display: flex; flex-wrap: wrap; gap: 10px 12px; align-items: center; justify-content: flex-end; }
  .tray.wide { flex-basis: 100%; justify-content: flex-start; }
  .btn { min-height: 56px; padding: 10px 22px; background: #fff; border: 3px solid var(--ui-ink); border-radius: 16px; box-shadow: var(--ui-shadow-press); font: var(--ui-t-button); cursor: pointer; transition: transform 90ms, box-shadow 90ms; }
  .btn.sun { background: var(--ui-sun); } .btn.big { font: var(--ui-t-test); padding: 14px 30px; }
  .btn:active:not(:disabled) { transform: translateY(5px); box-shadow: 0 1px 0 var(--ui-ink); }
  .btn:disabled { background: var(--ui-paper-dim); box-shadow: none; transform: translateY(5px); color: var(--ui-ink-soft); cursor: default; border-style: dashed; }
  .btn:focus-visible, .word:focus-visible, .tok:focus-visible, .sw:focus-visible { outline: 4px solid #2a6fdb; outline-offset: 3px; }
  .card .btn { margin-top: 4px; min-height: 48px; font: 800 20px/1.1 var(--ui-display); }
  .sentence { flex-basis: 100%; font: 600 22px/1.9 var(--ui-body); }
  .gap { display: inline-block; min-width: 150px; padding: 0 12px; border: 3px dashed var(--ui-ink-soft); border-radius: 12px; background: var(--ui-paper-dim); line-height: 1.5; text-align: center; color: var(--ui-ink-soft); cursor: pointer; }
  .gap.now { border-color: var(--ui-ink); background: #fff; } .gap.full { border-style: solid; border-color: var(--ui-ink); background: var(--ui-sun); color: var(--ui-ink); }
  .words { display: flex; flex-wrap: wrap; gap: 10px; }
  .word { min-height: 52px; padding: 8px 16px; background: #fff; border: 3px solid var(--ui-ink); border-radius: 14px; box-shadow: 0 5px 0 var(--ui-ink); font: var(--ui-t-chip); cursor: pointer; }
  .word:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--ui-ink); }
  .tok { display: grid; grid-template-columns: 44px auto; align-items: center; gap: 8px; min-width: 150px; min-height: 60px; padding: 5px 14px 5px 8px; background: #fff; border: 3px solid var(--ui-ink); border-radius: 14px; box-shadow: 0 5px 0 var(--ui-ink); font: 700 18px/1.15 var(--ui-body); text-align: left; cursor: pointer; }
  .tok small { display: block; font: 700 15px/1.2 var(--ui-body); color: var(--ui-ink-soft); }
  .tok.on { background: var(--ui-sun); }
  .tok.used { background: var(--ui-paper-dim); border-style: dashed; box-shadow: none; transform: translateY(5px); color: var(--ui-ink-soft); cursor: default; }
  .tok svg { width: 44px; height: 40px; }
  .sws { display: grid; grid-template-columns: repeat(2, 42px); gap: 8px; } .sws-h { font: 700 15px/1.1 var(--ui-body); color: var(--ui-ink-soft); margin-bottom: 6px; }
  .sw { width: 42px; height: 42px; border: 3px solid var(--ui-ink); border-radius: 10px; box-shadow: 0 4px 0 var(--ui-ink); cursor: pointer; padding: 0; }
  .sw.on { outline: 4px solid var(--ui-sun); outline-offset: 2px; transform: translateY(-3px); }
  .first { position: absolute; left: 16px; top: 76px; z-index: 3; display: flex; flex-direction: column; gap: 5px; padding: 9px 13px 10px; background: var(--ui-paper); border: 3px solid var(--ui-ink); border-radius: 14px; box-shadow: var(--ui-shadow-rest); font: 700 16px/1.2 var(--ui-body); }
  .first[hidden] { display: none; } .first b { font: 800 17px/1.2 var(--ui-display); } .first span { display: flex; align-items: center; gap: 8px; } .first .mark { width: 24px; height: 24px; font-size: 15px; }
  .fps { position: absolute; right: 16px; bottom: 8px; z-index: 4; font: 600 14px/1 var(--ui-body); background: #fff; border: 2px solid var(--ui-ink); border-radius: 8px; padding: 4px 8px; }
  @media (max-width: 900px), (max-height: 640px) {
    .band { grid-template-columns: 84px minmax(0, 1fr); min-height: 150px; } .flo { width: 84px; height: 110px; }
    .say { font-size: 17px; padding: 9px 14px; } .card p, .card .res { font-size: 14px; } .card h3 { font-size: 17px; } .btn { font-size: 19px; min-height: 48px; padding: 8px 14px; } .btn.big { font-size: 24px; }
    .sentence { font-size: 18px; } .word { font-size: 17px; min-height: 46px; } .trial { display: none; } .step { font-size: 18px; } .chip { font-size: 15px; height: 40px; } .chip b { width: 28px; height: 28px; }
  }
</style>
</head>
<body>
<div class="app ui">
  <div class="view" id="view">
    <canvas id="c"></canvas>
    <div class="plates" id="plates"></div>
    <div class="top"><div class="chip"><b>1</b>Eco Town <strong>Homes</strong></div><div class="step" id="step"></div><div class="trial">This is a trial level. Its words are placeholders.</div></div>
    <div class="first" id="first" hidden></div>
    <div class="over" id="over"></div>
    <div class="fps" id="fps" hidden></div>
  </div>
  <div class="band"><div class="flo" id="flo"></div><div class="right"><div class="say" id="say" aria-live="polite"></div><div class="tray" id="tray"></div></div></div>
</div>
<script type="module" src="trial.js"></script>
</body>
</html>
