<!doctype html>
<html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Eco Town film</title>
<link rel="stylesheet" href="../ui/tokens.css">
<style>
  @font-face { font-family: 'Inter'; src: url('inter.woff2') format('woff2'); font-weight: 400 900; }
  @font-face { font-family: 'Bricolage'; src: url('bricolage.woff2') format('woff2'); font-weight: 400 900; }
  :root { --bg: #f1ebdd; --fg: #1f2a44; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #1b1814; --fg: #f1e8d8; } }
  :root[data-theme="dark"] { --bg: #1b1814; --fg: #f1e8d8; }
  * { box-sizing: border-box; } html, body { margin: 0; background: var(--bg); color: var(--fg); font-family: Inter, system-ui, sans-serif; }
  .wrap { max-width: 1320px; margin: 0 auto; padding: 16px; } body.rec .wrap { padding: 0; max-width: none; } body.rec .bar, body.rec h1, body.rec .lead { display: none; }
  h1 { font-family: Bricolage, Inter, sans-serif; font-size: 1.5rem; margin: 0 0 4px; } .lead { margin: 0 0 12px; max-width: 70ch; }
  .fit { width: 100%; aspect-ratio: 16 / 9; position: relative; overflow: hidden; border-radius: 14px; border: 3px solid var(--fg); background: #dff1f7; } body.rec .fit { width: 1280px; height: 720px; border: 0; border-radius: 0; }
  .stage { width: 1280px; height: 720px; position: absolute; left: 0; top: 0; transform-origin: 0 0; overflow: hidden; }
  .stage canvas { position: absolute; inset: 0; width: 1280px; height: 720px; display: block; } canvas.fx { pointer-events: none; z-index: 4; }
  /* the interface comes from ../ui/tokens.css. The film draws every frame from a time, so nothing may move by the clock:
     the loops and bounces of tokens.css are switched off here and are set frame by frame in ui.js instead. */
  .ui { z-index: 3; }
  .ui *, .ui *::before, .ui *::after { animation: none !important; transition: none !important; }
  .ui button { margin-top: 0; }
  /* Florence stands in the world: she is mirrored for the whole film, and a flat oval lies under her feet */
  .flo { position: absolute; left: -46px; bottom: -20px; width: 193px; height: 250px; pointer-events: none; }
  .flo-body { position: absolute; inset: 0; transform-origin: 50% 92%; }
  .flo .ui-florence { left: 0; bottom: 0; filter: none; transform: scaleX(-1); }
  .flo-shadow { position: absolute; left: 44px; bottom: 12px; width: 106px; height: 16px; border-radius: 50%; background: #1f2a44; opacity: 0.25; }
  .ui-florence b { position: absolute; display: none; }
  .ui-florence .eye { width: 17px; height: 15px; margin: -8px 0 0 -8px; border-radius: 7px; background: #e8bd80; border-bottom: 3px solid #5a3a22; }
  .ui-florence .glow { width: 15px; height: 15px; margin: -7px 0 0 -7px; border-radius: 50%; background: #ffd257; border: 2.5px solid #fff3c4; box-shadow: 0 0 0 2px #e9ad1c; }
  .ui-florence .dot { width: 5px; height: 5px; border-radius: 2px; background: #ffd257; box-shadow: 0 0 0 1.5px #1f2a44; top: 88px; } .ui-florence .d1 { left: 158px; } .ui-florence .d2 { left: 166px; } .ui-florence .d3 { left: 174px; }
  .ui-bubble { transform-origin: 0 100%; } .ui-bubble p { white-space: pre-wrap; }
  .ui-sign { z-index: 3; transform-origin: 50% 50%; }
  .ui-sentence { padding: 2px 6px; border-radius: 8px; background-repeat: no-repeat; }
  .ui-tray--flat .ui-sentence { flex: 1; } .ui-sentence .nb { white-space: nowrap; }
  .ui-chips.col { flex-direction: column; align-items: stretch; }
  .ui-plan { transform-origin: 50% 100%; } .ui-plan__head .yc { margin-right: 4px; }
  .ui-plan.is-flat { transform: none !important; box-shadow: var(--ui-shadow-rest); }
  /* the small picture of the end of a test sits at the right of a card's first row */
  .ui-plan__head .ui-thumb { width: 112px; height: 64px; margin-left: auto; border-width: 2.5px; }
  .ui-thumb.fly { position: absolute; width: 168px; height: 96px; z-index: 5; transform-origin: 0 0; }
  .firstrow { display: flex; gap: 18px; align-items: flex-start; } .firsttext { flex: 1; display: flex; flex-direction: column; gap: 6px; }
  /* a flag whose plan is not being played stays solid, as the accessibility report asks, and is drawn smaller */
  .ui-flag { transform-origin: 50% 100%; } .ui-flag.is-resting b { border-style: dashed; }
  .ui-tag { z-index: 2; } .ui-chip--fly { white-space: nowrap; min-height: 44px; }
  .ui-panel .brk { font: 600 19px/1.3 var(--ui-body); }
  .ui-pointer { left: 0; top: 0; }
  .bar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-top: 12px; } .bar button, .bar select { font: inherit; padding: 8px 14px; border-radius: 10px; border: 2px solid var(--fg); background: transparent; color: inherit; min-height: 42px; } .bar input { flex: 1; min-width: 160px; } .bar span { font-variant-numeric: tabular-nums; }
</style></head>
<body>
<div class="wrap"><h1>Eco Town: the six levels as a film</h1>
<p class="lead">This film shows one sample child playing the six levels of Eco Town. Every test happens in the town itself. The recorded video has music and sound, and this page plays the pictures only.</p>
<div class="fit"><div class="stage"><canvas class="gl" width="1280" height="720"></canvas><div class="ui"></div><canvas class="fx" width="1280" height="720"></canvas></div></div>
<div class="bar"><button id="play">Play</button><select id="lev" aria-label="Go to a part of the film"></select><input id="scrub" type="range" min="0" max="2000" value="0" aria-label="Position in the film"><span id="clock"></span></div></div>
<script type="module">
  import D from './words.js'; import { makeFilm } from './film.js';
  const rec = new URLSearchParams(location.search).has('rec'); document.body.classList.toggle('rec', rec);
  const stage = document.querySelector('.stage'), fit = document.querySelector('.fit');
  const size = () => { stage.style.transform = `scale(${rec ? 1 : fit.clientWidth / 1280})`; }; size(); addEventListener('resize', () => { size(); film.seek(T); });
  await document.fonts.load('600 24px Inter'); await document.fonts.load('800 24px Bricolage'); await document.fonts.ready; await new Promise((r) => { const i = new Image(); i.onload = i.onerror = r; i.src = 'florence-sprite.webp'; });
  stage.querySelector('.ui').style.setProperty('--ui-florence-sprite', `url(${new URL('florence-sprite.webp', location.href)})`);
  const film = makeFilm(stage, D);
  let T = 0, playing = false, last = 0; const $ = (id) => document.getElementById(id), mmss = (s) => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, '0')}`;
  $('lev').innerHTML = film.segs.map((m, i) => `<option value="${i}">${film.name(m)}</option>`).join('');
  const paint = () => { film.seek(T); $('scrub').value = Math.round(T / film.duration * 2000); $('clock').textContent = `${mmss(T)} of ${mmss(film.duration)}`; const i = film.segs.findIndex((m) => T < m.start + m.dur); $('lev').value = i < 0 ? film.segs.length - 1 : i; };
  const tick = (now) => { if (!playing) return; T += Math.min(0.1, (now - last) / 1000); last = now; if (T >= film.duration) { T = film.duration - 0.01; playing = false; $('play').textContent = 'Play'; } paint(); requestAnimationFrame(tick); };
  $('play').onclick = () => { playing = !playing; $('play').textContent = playing ? 'Pause' : 'Play'; if (playing) { if (T >= film.duration - 0.1) T = 0; last = performance.now(); requestAnimationFrame(tick); } };
  $('scrub').oninput = (e) => { T = e.target.value / 2000 * film.duration; paint(); }; $('lev').onchange = (e) => { T = film.segs[+e.target.value].start; paint(); };
  // for the recorder: the parts of the film, a way to draw any moment, and the sound track
  window.film = { duration: film.duration, segs: film.segs, levels: film.segs.map((m) => ({ start: m.start, dur: m.dur, name: film.name(m), kind: m.kind, li: m.li })), seek: (t) => { T = t; film.seek(t); },
    // audio() makes the whole sound track and returns its length in bytes; audioPart(i, size) returns one piece of it as text
    async audio() { const { renderAudio } = await import('./sound.js'); const pcm = await renderAudio(film.segs, film.duration); window.film.pcm = new Uint8Array(pcm.buffer); return window.film.pcm.length; },
    audioPart(i, size) { const u8 = window.film.pcm.subarray(i * size, (i + 1) * size); let s = ''; for (let k = 0; k < u8.length; k += 0x8000) s += String.fromCharCode(...u8.subarray(k, k + 0x8000)); return btoa(s); } };
  paint();
</script>
</body></html>
