<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Eco Town animation</title>
<style>
  @font-face { font-family: 'Inter'; src: url('inter.woff2') format('woff2'); font-weight: 400 900; }
  @font-face { font-family: 'Bricolage'; src: url('bricolage.woff2') format('woff2'); font-weight: 400 900; }
  :root { --ink: #3b2a1e; --paper: #fffaf0; --edge: #e6d3b0; --bg: #f1ebdd; --fg: #3b2a1e; --good: #1f7a44; --bad: #b5402b; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #1b1814; --fg: #f1e8d8; } }
  :root[data-theme="dark"] { --bg: #1b1814; --fg: #f1e8d8; }
  * { box-sizing: border-box; } html, body { margin: 0; background: var(--bg); color: var(--fg); font-family: Inter, system-ui, sans-serif; }
  .wrap { max-width: 1320px; margin: 0 auto; padding: 16px; } body.rec .wrap { padding: 0; max-width: none; } body.rec .bar, body.rec h1, body.rec .lead { display: none; }
  h1 { font-family: Bricolage, Inter, sans-serif; font-size: 1.5rem; margin: 0 0 4px; } .lead { margin: 0 0 12px; max-width: 70ch; }
  .fit { width: 100%; aspect-ratio: 16 / 9; position: relative; overflow: hidden; border-radius: 14px; border: 3px solid var(--ink); background: #dff1f7; } body.rec .fit { width: 1280px; height: 720px; border: 0; border-radius: 0; }
  .stage { width: 1280px; height: 720px; position: absolute; left: 0; top: 0; transform-origin: 0 0; color: var(--ink); font-size: 20px; line-height: 1.35; }
  .stage canvas { position: absolute; inset: 0; width: 1280px; height: 720px; display: block; } .ui { position: absolute; inset: 0; } .veil { position: absolute; inset: 0; background: #fffaf0; pointer-events: none; }
  .ui > * { position: absolute; }
  .chip { left: 24px; top: 20px; background: var(--paper); border: 2.5px solid var(--ink); border-radius: 999px; padding: 6px 16px 6px 12px; font-size: 17px; box-shadow: 0 4px 0 var(--ink); } .chip b { background: var(--c); color: #fff; border-radius: 999px; padding: 2px 10px; margin-right: 6px; }
  .title { left: 50%; top: 250px; margin-left: -330px; width: 660px; text-align: center; background: var(--paper); border: 3px solid var(--ink); border-radius: 22px; padding: 26px 20px 30px; box-shadow: 0 8px 0 var(--ink); }
  .title small { display: block; font-size: 20px; color: var(--c); font-weight: 700; } .title b { font-family: Bricolage, Inter, sans-serif; font-size: 62px; line-height: 1.05; }
  .bub { left: 40px; bottom: 34px; display: flex; gap: 14px; align-items: flex-end; max-width: 900px; } .bub p { margin: 0; background: var(--paper); border: 3px solid var(--ink); border-radius: 22px 22px 22px 6px; padding: 14px 20px; font-size: 25px; font-weight: 600; box-shadow: 0 6px 0 var(--ink); }
  .who { flex: none; width: 58px; height: 58px; border-radius: 50%; background: #c8643f; color: #fff; display: grid; place-items: center; font-family: Bricolage, Inter, sans-serif; font-weight: 800; font-size: 30px; border: 3px solid var(--ink); box-shadow: 0 4px 0 var(--ink); }
  .ask { left: 40px; right: 40px; bottom: 26px; background: var(--paper); border: 3px solid var(--ink); border-radius: 22px; padding: 14px 22px 18px; box-shadow: 0 6px 0 var(--ink); min-height: 216px; }
  .lab { margin: 0 0 4px; font-size: 14px; letter-spacing: 0.08em; text-transform: uppercase; font-weight: 700; color: #7a6450; } .sent { margin: 0 0 12px; font-size: 23px; font-weight: 600; padding-right: 190px; }
  .gap { display: inline-block; min-width: 110px; border-bottom: 3px dashed #b79b74; vertical-align: bottom; } .gap i { font-style: normal; visibility: hidden; } .gap.on { border: 0; background: #ffe7a3; border-radius: 8px; padding: 0 8px; box-shadow: inset 0 0 0 2.5px var(--ink); } .gap.on i { visibility: visible; }
  .opts { display: flex; flex-wrap: wrap; gap: 10px; } .wb { background: #fff; border: 2.5px solid var(--ink); border-radius: 999px; padding: 7px 16px; font-size: 20px; font-weight: 600; box-shadow: 0 4px 0 var(--ink); } .wb.on { background: #ffd23f; transform: translateY(3px); box-shadow: 0 1px 0 var(--ink); }
  .btn { background: var(--ink); color: #fff; border-radius: 14px; padding: 10px 22px; font-weight: 800; font-size: 22px; font-family: Bricolage, Inter, sans-serif; box-shadow: 0 5px 0 #000; } .btn.down { transform: translateY(4px) !important; box-shadow: 0 1px 0 #000; }
  .askbtn { position: absolute; right: 22px; top: 16px; } .testbtn { left: 50%; bottom: 44px; margin-left: -190px; width: 380px; text-align: center; font-size: 34px; padding: 16px 20px; background: var(--c); border: 3px solid var(--ink); box-shadow: 0 7px 0 var(--ink); }
  .plan { width: 340px; transform-origin: 50% 0; } .plan .name { display: flex; gap: 10px; align-items: center; justify-content: center; background: var(--paper); border: 2.5px solid var(--ink); border-radius: 14px; padding: 6px 12px; font-weight: 700; font-size: 19px; box-shadow: 0 4px 0 var(--ink); }
  .plan.on .name { background: #ffd23f; } .let { flex: none; width: 30px; height: 30px; border-radius: 50%; background: var(--ink); color: #fff; display: grid; place-items: center; font-size: 17px; }
  .rows { margin-top: 10px; display: grid; gap: 6px; opacity: 0; transform: translateY(10px); transition: none; } .plan.res .rows { opacity: 1; transform: none; }
  .rows p { margin: 0; background: var(--paper); border: 2px solid var(--ink); border-radius: 12px; padding: 6px 10px 6px 40px; font-size: 16.5px; font-weight: 600; position: relative; line-height: 1.25; }
  .rows i { position: absolute; left: 8px; top: 50%; margin-top: -12px; width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; font-style: normal; color: #fff; font-weight: 800; font-size: 15px; background: #8a7a66; } .rows .g i { background: var(--good); } .rows .p i { background: var(--bad); }
  .yn { left: 50%; top: 96px; margin-left: -110px; display: flex; gap: 16px; } .yn .wb { font-size: 26px; padding: 10px 28px; }
  .ptr { left: -20px; top: -20px; width: 40px; height: 40px; border-radius: 50%; background: rgba(255, 255, 255, 0.92); border: 3px solid var(--ink); box-shadow: 0 4px 0 rgba(0, 0, 0, 0.35); } .ptr.tap { background: #ffd23f; box-shadow: 0 0 0 10px rgba(255, 210, 63, 0.45); }
  .bar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-top: 12px; } .bar button, .bar select { font: inherit; padding: 8px 14px; border-radius: 10px; border: 2px solid var(--fg); background: transparent; color: inherit; min-height: 42px; } .bar input { flex: 1; min-width: 160px; } .bar span { font-variant-numeric: tabular-nums; }
</style></head>
<body>
<div class="wrap"><h1>Eco Town: the six levels as an animation</h1>
<p class="lead">This film follows the storyboard. It shows one sample child playing each level. It has no sound.</p>
<div class="fit"><div class="stage"><canvas width="1280" height="720"></canvas><div class="ui"></div><div class="veil"></div></div></div>
<div class="bar"><button id="play">Play</button><select id="lev" aria-label="Go to a level"></select><input id="scrub" type="range" min="0" max="1000" value="0" aria-label="Position in the film"><span id="clock"></span></div></div>
<script type="module">
  import D from './words.js'; import { makeFilm } from './film.js'; import * as eco from './eco.js';
  const rec = new URLSearchParams(location.search).has('rec'); document.body.classList.toggle('rec', rec);
  const stage = document.querySelector('.stage'), fit = document.querySelector('.fit');
  const size = () => { stage.style.transform = `scale(${rec ? 1 : fit.clientWidth / 1280})`; }; size(); addEventListener('resize', () => { size(); film.seek(T); });
  await document.fonts.ready;
  const film = makeFilm(stage, D, [{ ti: 0, builders: eco.builders, nightOf: eco.nightOf, points: eco.points }]);
  let T = 0, playing = false, last = 0; const $ = (id) => document.getElementById(id), mmss = (s) => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, '0')}`;
  $('lev').innerHTML = film.levels.map((m, i) => `<option value="${i}">Level ${m.li + 1}: ${m.v.name}</option>`).join('');
  const paint = () => { film.seek(T); $('scrub').value = Math.round(T / film.duration * 1000); $('clock').textContent = `${mmss(T)} of ${mmss(film.duration)}`; const i = film.levels.findIndex((m) => T < m.start + m.dur); $('lev').value = i < 0 ? film.levels.length - 1 : i; };
  const tick = (now) => { if (!playing) return; T += Math.min(0.1, (now - last) / 1000); last = now; if (T >= film.duration) { T = film.duration - 0.01; playing = false; $('play').textContent = 'Play'; } paint(); requestAnimationFrame(tick); };
  $('play').onclick = () => { playing = !playing; $('play').textContent = playing ? 'Pause' : 'Play'; if (playing) { if (T >= film.duration - 0.1) T = 0; last = performance.now(); requestAnimationFrame(tick); } };
  $('scrub').oninput = (e) => { T = e.target.value / 1000 * film.duration; paint(); }; $('lev').onchange = (e) => { T = film.levels[+e.target.value].start; paint(); };
  window.film = { duration: film.duration, levels: film.levels.map((m) => ({ start: m.start, dur: m.dur, name: m.v.name })), seek: (t) => { T = t; film.seek(t); } };
  paint();
</script>
</body></html>
