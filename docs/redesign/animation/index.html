<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Eco Town animation</title>
<style>
  @font-face { font-family: 'Inter'; src: url('inter.woff2') format('woff2'); font-weight: 400 900; }
  @font-face { font-family: 'Bricolage'; src: url('bricolage.woff2') format('woff2'); font-weight: 400 900; }
  :root { --ink: #3b2a1e; --paper: #fffaf0; --bg: #f1ebdd; --fg: #3b2a1e; --good: #1f7a44; --bad: #b5402b; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #1b1814; --fg: #f1e8d8; } }
  :root[data-theme="dark"] { --bg: #1b1814; --fg: #f1e8d8; }
  * { box-sizing: border-box; } html, body { margin: 0; background: var(--bg); color: var(--fg); font-family: Inter, system-ui, sans-serif; }
  .wrap { max-width: 1320px; margin: 0 auto; padding: 16px; } body.rec .wrap { padding: 0; max-width: none; } body.rec .bar, body.rec h1, body.rec .lead { display: none; }
  h1 { font-family: Bricolage, Inter, sans-serif; font-size: 1.5rem; margin: 0 0 4px; } .lead { margin: 0 0 12px; max-width: 70ch; }
  .fit { width: 100%; aspect-ratio: 16 / 9; position: relative; overflow: hidden; border-radius: 14px; border: 3px solid var(--ink); background: #dff1f7; } body.rec .fit { width: 1280px; height: 720px; border: 0; border-radius: 0; }
  .stage { width: 1280px; height: 720px; position: absolute; left: 0; top: 0; transform-origin: 0 0; color: var(--ink); font-size: 20px; line-height: 1.35; overflow: hidden; }
  .stage canvas { position: absolute; inset: 0; width: 1280px; height: 720px; display: block; } canvas.fx { pointer-events: none; z-index: 4; } .ui { position: absolute; inset: 0; z-index: 3; }
  .ui > * { position: absolute; }
  .chip { left: 24px; top: 20px; background: var(--paper); border: 2.5px solid var(--ink); border-radius: 999px; padding: 6px 16px 6px 8px; font-size: 17px; font-weight: 600; box-shadow: 0 4px 0 var(--ink); } .chip b { background: var(--c); color: #fff; border-radius: 999px; padding: 3px 12px; margin-right: 6px; }
  .dots { right: 24px; top: 20px; display: flex; gap: 8px; } .dots i { width: 36px; height: 36px; border-radius: 50%; border: 2.5px solid var(--ink); background: var(--paper); display: grid; place-items: center; font-style: normal; font-weight: 800; font-size: 16px; box-shadow: 0 3px 0 var(--ink); } .dots .done { background: #2e9b5a; color: #fff; } .dots .now { background: #ffd23f; }
  .title { left: 50%; top: 240px; margin-left: -360px; width: 720px; display: flex; gap: 22px; align-items: center; background: var(--paper); border: 3px solid var(--ink); border-radius: 26px; padding: 22px 28px; box-shadow: 0 9px 0 var(--ink); }
  .title em { flex: none; width: 104px; height: 104px; border-radius: 26px; background: var(--c); color: #fff; display: grid; place-items: center; font: 800 68px Bricolage, Inter, sans-serif; font-style: normal; border: 3px solid var(--ink); box-shadow: 0 5px 0 var(--ink); transform: rotate(-5deg); }
  .title small { display: block; font-size: 20px; color: var(--c); font-weight: 800; } .title b { font-family: Bricolage, Inter, sans-serif; font-size: 58px; line-height: 1.05; }
  .banner { left: 50%; top: 70px; margin-left: -300px; width: 600px; text-align: center; background: var(--c); color: #fff; border: 3px solid var(--ink); border-radius: 28px; padding: 18px 20px 24px; box-shadow: 0 9px 0 var(--ink); } .banner small { display: block; font-weight: 800; font-size: 22px; opacity: 0.92; } .banner b { font: 800 76px/1 Bricolage, Inter, sans-serif; }
  .flo { left: 4px; bottom: 2px; width: 214px; height: 277px; transform-origin: 0 100%; z-index: 2; filter: drop-shadow(0 6px 0 rgba(59, 42, 30, 0.25)); } .flo i { display: block; width: 100%; height: 100%; background: url('florence-sprite.webp') 0 0 / 600% 500% no-repeat; }
  .bub { left: 214px; bottom: 96px; max-width: 880px; z-index: 2; } .bub p { margin: 0; background: var(--paper); border: 3px solid var(--ink); border-radius: 24px 24px 24px 6px; padding: 14px 22px; font-size: 25px; font-weight: 600; box-shadow: 0 6px 0 var(--ink); } .bub .h { color: transparent; }
  .bub.dotty p { font-size: 40px; line-height: 0.7; padding: 10px 26px 24px; letter-spacing: 6px; }
  .ask { left: 216px; right: 30px; bottom: 22px; background: var(--paper); border: 3px solid var(--ink); border-radius: 24px; padding: 14px 22px 18px; box-shadow: 0 7px 0 var(--ink); min-height: 206px; z-index: 2; }
  .lab { margin: 0 0 4px; font-size: 14px; letter-spacing: 0.08em; text-transform: uppercase; font-weight: 800; color: #7a6450; } .sent { margin: 0 0 12px; font-size: 23px; font-weight: 600; padding-right: 200px; }
  .gap { display: inline-block; min-width: 120px; border-bottom: 3px dashed #b79b74; vertical-align: bottom; } .gap i { font-style: normal; visibility: hidden; } .gap.on { border: 0; background: #ffe7a3; border-radius: 8px; padding: 0 8px; box-shadow: inset 0 0 0 2.5px var(--ink); } .gap.on i { visibility: visible; }
  .opts { display: flex; flex-wrap: wrap; gap: 10px; } .wb { background: #fff; border: 2.5px solid var(--ink); border-radius: 999px; padding: 7px 16px; font-size: 20px; font-weight: 600; box-shadow: 0 4px 0 var(--ink); } .wb.on { background: #ffd23f; box-shadow: 0 1px 0 var(--ink); }
  .fly { z-index: 6; transform: translate(-50%, -50%); white-space: nowrap; box-shadow: 0 8px 0 rgba(59, 42, 30, 0.3); }
  .btn { background: var(--ink); color: #fff; border-radius: 14px; padding: 10px 22px; font-weight: 800; font-size: 22px; font-family: Bricolage, Inter, sans-serif; box-shadow: 0 5px 0 #000; } .btn.down { box-shadow: 0 1px 0 #000; margin-top: 4px; }
  .askbtn { position: absolute; right: 22px; top: 16px; } .testbtn { left: 50%; bottom: 40px; margin-left: -210px; width: 420px; text-align: center; font-size: 38px; padding: 18px 20px; background: var(--c); border: 3px solid var(--ink); border-radius: 22px; box-shadow: 0 8px 0 var(--ink); z-index: 2; } .testbtn.down { box-shadow: 0 2px 0 var(--ink); }
  .running { left: 50%; top: 18px; margin-left: -200px; width: 400px; background: var(--paper); border: 3px solid var(--ink); border-radius: 18px; padding: 8px 16px 12px; text-align: center; box-shadow: 0 5px 0 var(--ink); } .running b { font: 800 22px Bricolage, Inter, sans-serif; display: block; margin-bottom: 4px; } .running u { display: block; height: 12px; border-radius: 6px; border: 2px solid var(--ink); background: #fff; overflow: hidden; } .running s { display: block; height: 100%; background: var(--c); }
  .plan { width: 350px; transform-origin: 50% 0; } .plan .name { display: flex; gap: 10px; align-items: center; justify-content: center; background: var(--paper); border: 2.5px solid var(--ink); border-radius: 14px; padding: 6px 12px; font-weight: 700; font-size: 19px; box-shadow: 0 4px 0 var(--ink); }
  .plan.on .name { background: #ffd23f; } .let { flex: none; width: 30px; height: 30px; border-radius: 50%; background: var(--ink); color: #fff; display: grid; place-items: center; font-size: 17px; }
  .rows { margin-top: 10px; display: grid; gap: 6px; } .rows p { margin: 0; background: var(--paper); border: 2px solid var(--ink); border-radius: 12px; padding: 6px 10px 6px 42px; font-size: 16.5px; font-weight: 600; position: relative; line-height: 1.25; opacity: 0; box-shadow: 0 3px 0 rgba(59, 42, 30, 0.35); }
  .rows i { position: absolute; left: 8px; top: 50%; margin-top: -13px; width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; font-style: normal; color: #fff; font-weight: 800; font-size: 16px; background: #8a7a66; } .rows .g i { background: var(--good); } .rows .p i { background: var(--bad); }
  .yn { left: 50%; top: 110px; margin-left: -120px; display: flex; gap: 16px; } .yn .wb { font-size: 28px; padding: 10px 30px; }
  .target { width: 92px; height: 92px; border-radius: 50%; border: 6px dashed #fff; box-shadow: 0 0 0 4px var(--ink), inset 0 0 0 4px var(--ink); } .target.hit { border-style: solid; border-color: #ffd23f; background: rgba(255, 210, 63, 0.35); }
  .ptr { left: -20px; top: -20px; width: 40px; height: 40px; border-radius: 50%; background: rgba(255, 255, 255, 0.92); border: 3px solid var(--ink); box-shadow: 0 4px 0 rgba(0, 0, 0, 0.35); z-index: 7; } .ptr.tap { background: #ffd23f; }
  .wipe { inset: 0; z-index: 8; pointer-events: none; overflow: hidden; } .wipe i { position: absolute; left: -15%; top: 0; width: 130%; height: 100%; visibility: hidden; } .wipe i:nth-child(1) { background: #ffd23f; } .wipe i:nth-child(2) { background: #c8643f; } .wipe i:nth-child(3) { background: #fffaf0; }
  .jobs { right: 40px; top: 84px; width: 560px; background: var(--paper); border: 3px solid var(--ink); border-radius: 26px; padding: 20px 26px 26px; box-shadow: 0 9px 0 var(--ink); } .jobs h2 { margin: 0 0 4px; font: 800 34px/1.1 Bricolage, Inter, sans-serif; color: var(--c); } .jobs p { margin: 0 0 12px; font-weight: 600; }
  .job { position: relative; background: #fff; border: 2.5px solid var(--ink); border-radius: 14px; padding: 10px 14px; margin-top: 10px; font-weight: 600; box-shadow: 0 4px 0 var(--ink); }
  .bar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-top: 12px; } .bar button, .bar select { font: inherit; padding: 8px 14px; border-radius: 10px; border: 2px solid var(--fg); background: transparent; color: inherit; min-height: 42px; } .bar input { flex: 1; min-width: 160px; } .bar span { font-variant-numeric: tabular-nums; }
</style></head>
<body>
<div class="wrap"><h1>Eco Town: the six levels as an animation</h1>
<p class="lead">This film follows the storyboard. It shows one sample child playing each level of Eco Town. The recorded video has music and sound, and this page plays the pictures only.</p>
<div class="fit"><div class="stage"><canvas class="gl" width="1280" height="720"></canvas><div class="ui"></div><canvas class="fx" width="1280" height="720"></canvas></div></div>
<div class="bar"><button id="play">Play</button><select id="lev" aria-label="Go to a part of the film"></select><input id="scrub" type="range" min="0" max="1000" value="0" aria-label="Position in the film"><span id="clock"></span></div></div>
<script type="module">
  import D from './words.js'; import { makeFilm } from './film.js'; import * as eco from './eco.js'; import { makeIsland, makeScene, VIEWS, TAPS } from './town.js';
  const rec = new URLSearchParams(location.search).has('rec'); document.body.classList.toggle('rec', rec);
  const stage = document.querySelector('.stage'), fit = document.querySelector('.fit');
  const size = () => { stage.style.transform = `scale(${rec ? 1 : fit.clientWidth / 1280})`; }; size(); addEventListener('resize', () => { size(); film.seek(T); });
  await document.fonts.ready; await new Promise((r) => { const i = new Image(); i.onload = i.onerror = r; i.src = 'florence-sprite.webp'; });
  const film = makeFilm(stage, D, { ti: 0, builders: eco.builders, nightOf: eco.nightOf, makeIsland, makeScene, VIEWS, TAPS });
  let T = 0, playing = false, last = 0; const $ = (id) => document.getElementById(id), mmss = (s) => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, '0')}`;
  const nameOf = (m) => (m.kind === 'welcome' ? 'The town opens' : m.kind === 'end' ? 'The end of the hour' : `Level ${m.li + 1}: ${m.v.name}`);
  $('lev').innerHTML = film.segs.map((m, i) => `<option value="${i}">${nameOf(m)}</option>`).join('');
  const paint = () => { film.seek(T); $('scrub').value = Math.round(T / film.duration * 1000); $('clock').textContent = `${mmss(T)} of ${mmss(film.duration)}`; const i = film.segs.findIndex((m) => T < m.start + m.dur); $('lev').value = i < 0 ? film.segs.length - 1 : i; };
  const tick = (now) => { if (!playing) return; T += Math.min(0.1, (now - last) / 1000); last = now; if (T >= film.duration) { T = film.duration - 0.01; playing = false; $('play').textContent = 'Play'; } paint(); requestAnimationFrame(tick); };
  $('play').onclick = () => { playing = !playing; $('play').textContent = playing ? 'Pause' : 'Play'; if (playing) { if (T >= film.duration - 0.1) T = 0; last = performance.now(); requestAnimationFrame(tick); } };
  $('scrub').oninput = (e) => { T = e.target.value / 1000 * film.duration; paint(); }; $('lev').onchange = (e) => { T = film.segs[+e.target.value].start; paint(); };
  window.film = { duration: film.duration, levels: film.segs.map((m) => ({ start: m.start, dur: m.dur, name: nameOf(m), kind: m.kind, sfx: m.sfx, says: m.says, li: m.li })), seek: (t) => { T = t; film.seek(t); },
    // the sound track, for the recorder: audio() makes it and returns its length; audioPart(i) returns one piece as text
    async audio(lead = 0) { const { renderAudio } = await import('./sound.js'); const pcm = await renderAudio(window.film.levels, film.duration, lead); window.film.pcm = new Uint8Array(pcm.buffer); return window.film.pcm.length; },
    audioPart(i, size) { const u8 = window.film.pcm.subarray(i * size, (i + 1) * size); let s = ''; for (let k = 0; k < u8.length; k += 0x8000) s += String.fromCharCode(...u8.subarray(k, k + 0x8000)); return btoa(s); } };
  paint();
</script>
</body></html>
